# Builds the installers for every platform. A pushed tag (v0.1.0, ...) also
# creates a draft GitHub release with all of them attached; any other run
# leaves them as workflow artifacts.
name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: packaging/flatpak/com.rationalboxes.ReVoiceOver.yml
          bundle: ReVoiceOver-linux-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/*.yml', 'packaging/flatpak/*.json') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: ReVoiceOver-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install nasm
        if: matrix.arch == 'x86_64'
        run: brew install nasm
      - uses: actions/cache@v6
        with:
          path: build/ffmpeg
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('packaging/macos/build_ffmpeg.sh') }}
      - name: Build app and disk image
        run: packaging/macos/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: releases/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: packaging\windows\build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: releases/*-setup.exe
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flatpak, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: releases
          merge-multiple: true
      - name: Name the Flatpak bundles after the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for f in releases/ReVoiceOver-linux-*.flatpak; do
            arch="${f##*-}"; mv "$f" "releases/ReVoiceOver-$version-linux-$arch"
          done
          (cd releases && sha256sum * > SHA256SUMS.txt)
          ls -l releases
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: releases/*
