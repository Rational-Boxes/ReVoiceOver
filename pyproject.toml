[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "narration-rebuild"
version = "0.1.0"
description = "Rebuild a video's voiceover: transcribe, clean, re-synthesize in a cloned voice, remux."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "keyring>=24",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# wxPython itself comes from the system package (python3-wxpython4 on Fedora);
# create the venv with --system-site-packages so it is visible.
gui = ["sounddevice>=0.4"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
narr = "narration.cli:app"
narr-gui = "narration.gui.app:main"

[tool.setuptools.packages.find]
include = ["narration*"]

[tool.setuptools.package-data]
"narration.gui" = ["resources/icons/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: needs a display (run under xvfb-run)", "ffmpeg: needs ffmpeg on PATH"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["wx", "wx.*", "keyring", "keyring.*", "sounddevice", "soundfile", "jiwer"]
ignore_missing_imports = true
